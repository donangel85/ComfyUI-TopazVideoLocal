# Publish to the ComfyUI Registry.
#
# Deliberately manual-only (`workflow_dispatch`). The usual setup fires this on every
# push that touches pyproject.toml, which is fine once a package has a publisher and a
# version history, and a trap before it has either — a stray edit would publish a first
# release nobody meant to make. Change the trigger when that stops being true.
#
# A fork publishing under its own name needs two things of its own, and neither can be
# filled in from here:
#
#   1. `[tool.comfy] PublisherId` in pyproject.toml — the publisher name from
#      registry.comfy.org, created with a GitHub login. Without the leading "@" that
#      the site shows.
#   2. A repository secret named REGISTRY_ACCESS_TOKEN, from the same place.
#
# Without them the run stops before publishing anything, which is the right way round.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to publish an unfinished pyproject
        # A fork that has not filled these in would otherwise register a node pack
        # pointing at somebody else's repository under an empty publisher.
        shell: bash
        run: |
          python -c "import re, sys, pathlib; t = pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); p = (['Repository still says USERNAME'] if 'USERNAME' in t else []) + (['PublisherId is empty'] if re.search(r'PublisherId\s*=\s*\"\"', t) else []); print('Not ready to publish: ' + '; '.join(p)) if p else print('pyproject.toml looks publishable'); sys.exit(1 if p else 0)"

      - name: Publish
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
