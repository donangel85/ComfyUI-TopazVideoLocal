# The unit suite, on every push and pull request.
#
# It runs without Topaz and without ComfyUI on purpose: `topaz_video` has no ComfyUI
# imports, and the two test files that do reach into the node layer only read
# INPUT_TYPES, which needs neither. That is what makes CI possible at all — nothing here
# could run a Topaz filter.
#
# What CI cannot check is in research/, outside this repository: the integration scripts
# that drive the real installation, the picture measurements, and object_info_check.py,
# which asks a running ComfyUI whether it agrees with these node definitions. Those stay
# manual, on a machine that has Topaz.
#
# Linux is in the matrix even though the package supports Windows only. The backend is
# meant to be plain logic, and a Windows assumption creeping into it should fail here
# rather than on somebody's Mac. tests/test_discovery.py states the platform it means
# instead of inheriting the runner's.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run the suite
        # The output is repeated into the job summary and into one annotation when it
        # fails. Downloading a job log needs admin rights on the repository even when
        # the repository is public, so without this a failing run is a red cross and
        # nothing else to anybody who does not own it.
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.out 2>&1
          code=$?
          cat pytest.out
          if [ "$code" -ne 0 ]; then
            {
              echo "### pytest failed — ${{ matrix.os }}, Python ${{ matrix.python }}"
              echo '```'
              tail -120 pytest.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python -c "import pathlib; ls = pathlib.Path('pytest.out').read_text(errors='replace').splitlines()[-60:]; print('::error title=pytest failure::' + '%0A'.join(l.replace('%', '%25').rstrip() for l in ls))"
          fi
          exit $code

      - name: The node layer imports without ComfyUI
        # A node that fails to import does not appear in ComfyUI's menu at all, and the
        # only trace is a line in a startup log nobody is watching.
        shell: bash
        run: |
          python -c "import importlib.util, sys; spec = importlib.util.spec_from_file_location('cts', '__init__.py', submodule_search_locations=['.']); m = importlib.util.module_from_spec(spec); sys.modules['cts'] = m; spec.loader.exec_module(m); print(len(m.NODE_CLASS_MAPPINGS), 'nodes'); assert len(m.NODE_CLASS_MAPPINGS) == len(m.NODE_DISPLAY_NAME_MAPPINGS)"
