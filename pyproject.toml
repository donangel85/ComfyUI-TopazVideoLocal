[project]
name = "comfyui-topazvideolocal"
description = "Topaz Video AI nodes for ComfyUI. All processing runs locally."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy"]
classifiers = [
    # Automatic detection of the Topaz installation is implemented for Windows only,
    # and Windows is the only platform this has been run on. The backend itself is
    # plain Python and the test suite passes on Linux in CI; what is untested is
    # everything that touches a real Topaz installation.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/donangel85/ComfyUI-TopazVideoLocal"

[tool.comfy]
# The publisher name from registry.comfy.org, without the leading "@" the site shows.
# A fork publishing under its own name needs its own publisher here and its own
# REGISTRY_ACCESS_TOKEN repository secret.
PublisherId = "donangel85"
DisplayName = "ComfyUI-TopazVideoLocal"
# Optional: a URL to a square icon, 400x400 or smaller.
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode keeps pytest from walking up into the package root and importing
# __init__.py, which pulls in the ComfyUI-dependent node layer.
addopts = "--import-mode=importlib"
